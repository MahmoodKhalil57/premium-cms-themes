name: Deploy themes

# Themes are independent deploy units — one Astro site, one Worker each.
# `detect` narrows the push down to the themes that actually changed, and the
# deploy job fans out over just those. With hundreds of themes on one image,
# never deploy the whole set because one of them moved.
on:
  push:
    branches: [main]
    paths:
      - "themes/**"
  workflow_dispatch:
    inputs:
      themes:
        description: "Theme slugs to deploy, comma-separated. Blank = every theme."
        required: false
        default: ""

concurrency:
  # Serialise per branch: two overlapping deploys of the same Worker race on
  # the same D1 and Worker version.
  group: deploy-themes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.pick.outputs.themes }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to diff against.
          fetch-depth: 0

      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW='${{ github.event.inputs.themes }}'
            if [ -z "$RAW" ]; then
              THEMES=$(for d in themes/*/; do [ -f "$d/package.json" ] && basename "$d"; done \
                | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
              echo "manual run: all themes"
            else
              THEMES=$(python3 -c "import json,sys; print(json.dumps([s.strip() for s in sys.argv[1].split(',') if s.strip()]))" "$RAW")
              echo "manual run: $RAW"
            fi
          else
            THEMES=$(bin/changed-themes.sh "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "themes=$THEMES" >> "$GITHUB_OUTPUT"
          COUNT=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$THEMES")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Deploying $COUNT theme(s): $THEMES"

  deploy:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # One theme's failure must not cancel the others' deploys.
      fail-fast: false
      matrix:
        theme: ${{ fromJson(needs.detect.outputs.themes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: premium-cms-themes

      # A theme may consume a plugin from the sibling repo through a `file:`
      # dependency, which has to resolve at install time. The checkout paths
      # are what make `../../../premium-cms-plugins` resolve from
      # premium-cms-themes/themes/<slug>. This is the one place themes and
      # plugins are still coupled — see the repo README.
      - uses: actions/checkout@v4
        with:
          repository: MahmoodKhalil57/premium-cms-plugins
          path: premium-cms-plugins

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build any local plugins this theme depends on
        working-directory: premium-cms-themes
        run: bin/build-plugin-deps.sh themes/${{ matrix.theme }}

      - name: Install
        working-directory: premium-cms-themes/themes/${{ matrix.theme }}
        run: bun install

      - name: Build
        working-directory: premium-cms-themes/themes/${{ matrix.theme }}
        run: bunx astro build

      - name: Deploy
        working-directory: premium-cms-themes/themes/${{ matrix.theme }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f wrangler.jsonc ] && [ ! -f wrangler.toml ]; then
            echo "no wrangler config — this theme is not Cloudflare-deployed; skipping"
            exit 0
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          bunx wrangler deploy
