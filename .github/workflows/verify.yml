name: Verify themes

# Runs on pull requests and on pushes that are not deploys. Same narrowing as
# the deploy workflow: only check the themes the change actually touched.
on:
  pull_request:
    paths:
      - "themes/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

concurrency:
  group: verify-themes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Formatting
        run: bunx prettier --check .
      - name: JSON / JSONC validity
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files '*.json' '*.jsonc')
          node bin/check-json.mjs "${FILES[@]}"

  detect:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.pick.outputs.themes }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          set -euo pipefail
          THEMES=$(bin/changed-themes.sh "origin/${{ github.base_ref || 'main' }}" HEAD)
          echo "themes=$THEMES" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$THEMES")" >> "$GITHUB_OUTPUT"
          echo "Checking: $THEMES"

  check:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJson(needs.detect.outputs.themes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: premium-cms-themes
      - uses: actions/checkout@v4
        with:
          repository: MahmoodKhalil57/premium-cms-plugins
          path: premium-cms-plugins
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build local plugin dependencies
        working-directory: premium-cms-themes
        run: bin/build-plugin-deps.sh themes/${{ matrix.theme }}
      - name: Install
        working-directory: premium-cms-themes/themes/${{ matrix.theme }}
        run: bun install
      - name: Typecheck
        working-directory: premium-cms-themes/themes/${{ matrix.theme }}
        run: bunx astro check
      - name: Build
        working-directory: premium-cms-themes/themes/${{ matrix.theme }}
        run: bunx astro build
